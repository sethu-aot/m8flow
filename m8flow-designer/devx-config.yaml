# DevX CD Configuration — m8flow-designer
# EKS deployment for dev. The Deployment is created by the Helm chart
# (m8flow-charts/charts/m8flow-designer); CD then patches its image.
# demo and qa are added once dev is stable on refactor/next-gen.

deployment:
  enabled: true
  target: eks
  method: patch

  environments:
    dev:
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-designer
      container_name: m8flow-designer
      helm:
        release_name: m8flow-designer
        chart_path: m8flow-charts/charts/m8flow-designer
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
