name: m8flow-mcp-server CI/CD
# =============================================================================
# Triggers:
#   PR to 'main'           → CI only (lint, test, SAST, Trivy, build check)
#   Push/merge to 'main'   → CI only (build + push image to Docker Hub)
#   workflow_dispatch       → CD only (promote pre-built image to dev/demo/qa)
#
# ALL deployments are manual via workflow_dispatch (promotion-only).
# QA and DEMO MUST receive a pre-built image_uri — no fresh builds on dispatch.
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - "m8flow-mcp/**"
      - ".github/workflows/mcp-server-cicd.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "m8flow-mcp/**"
      - ".github/workflows/mcp-server-cicd.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - demo
          - qa
      image_uri:
        description: "Pre-built image URI to promote (e.g. m8flow/m8flow-mcp-server-service:dev-a1b2c3d)"
        required: true
        type: string

# Grant the permissions the reusable CI orchestrator needs (security-events,
# actions, packages, pull-requests, id-token). The CD orchestrator handles its
# own AWS OIDC via id-token: write which is also covered here.
permissions:
  contents: write
  security-events: write
  actions: write
  packages: write
  pull-requests: write
  id-token: write
  deployments: write

concurrency:
  group: mcp-server-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: MCP Server CI Pipeline
    if: github.event_name != 'workflow_dispatch'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@13e89ba2e25a9dff7349e9f877395193bf18ae91
    with:
      config_path: m8flow-mcp/devx-ci.yaml
      auto_merge: false
      # Never publishes. release.yaml is the only workflow that pushes an
      # image, and it tags it X.Y.Z-rc. A merge to main runs the full CI --
      # build, test, SAST -- and discards the image, which matches what the
      # pipeline being replaced did: nothing was published outside a release.
      push: false
      registry_username: ${{ vars.DOCKERHUB_USERNAME }}
    secrets:
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  cd-dev:
    name: Deploy MCP Server → DEV
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@13e89ba2e25a9dff7349e9f877395193bf18ae91
    with:
      environment: dev
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-mcp/devx-config.yaml
    secrets: inherit

  cd-demo:
    name: Deploy MCP Server → DEMO
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'demo'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@13e89ba2e25a9dff7349e9f877395193bf18ae91
    with:
      environment: demo
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-mcp/devx-config.yaml
    secrets: inherit

  cd-qa:
    name: Deploy MCP Server → QA
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@13e89ba2e25a9dff7349e9f877395193bf18ae91
    with:
      environment: qa
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-mcp/devx-config.yaml
    secrets: inherit
