name: Release

# =============================================================================
# Releases refactor/next-gen. One manual dispatch:
#   1. resolve and create the next X.Y.Z-rc tag on the release branch
#   2. build every selected component at that exact tag and push it to ECR
#      (us-east-2), through the GitHubActions-ECS-m8flow OIDC role
#
# It publishes only; it deploys nothing. Deploying a released image is the
# manual workflow_dispatch of each component's *-cicd.yaml, as on main.
#
# Versions: next-gen releases are 2.x (main stays on 1.0.x). The first run
# sets tag_name 2.0.0-rc; later runs auto-increment the patch from the latest
# tag on this branch, so the two lines never pick the same number.
#
# The build must live in this run rather than in a `push: tags:` workflow:
# GitHub does not start a workflow run from an event created with the default
# GITHUB_TOKEN, so a tag pushed by step 1 would never trigger step 2. Chaining
# on needs keeps the tag and the images atomic to one run.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create (X.Y.Z-rc; 2.x for next-gen). Leave empty to auto-increment the patch."
        required: false
        type: string
      commit_sha:
        description: "Commit to tag. Leave empty for the tip of the release branch."
        required: false
        type: string
      components:
        description: 'Which components to release ("all" for a full set)'
        required: false
        default: all
        type: choice
        options:
          - all
          - backend
          - designer
          - keycloak
          - connector-proxy
      dry_run:
        description: "Resolve the tag only; create nothing and build nothing"
        required: false
        default: false
        type: boolean

# Declared once at workflow level. A job-level permissions block on a job that
# calls a reusable workflow makes the run fail to start, so the superset lives
# here: contents: write for tag creation, id-token: write for the ECR role, the
# rest for the CI orchestrator.
permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Cut Release Tag
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/release-tag.yaml@test/m8flow-nextgen # TEMPORARY: fork DevX
    with:
      # TEMPORARY: fork testing. refactor/next-gen before the PR.
      base_branch: feat/M8F-556-nextgen-cicd
      tag_name: ${{ inputs.tag_name }}
      commit_sha: ${{ inputs.commit_sha }}
      version_suffix: "-rc"
      dry_run: ${{ inputs.dry_run }}

  # Every component is built at the same version, so a release is one complete,
  # consistent set of images rather than whichever parts happened to change.
  # The registry (ECR) and its role come from each component's devx-ci.yaml.
  backend:
    name: Release m8flow-backend
    needs: tag
    if: inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'backend')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@test/m8flow-nextgen # TEMPORARY: fork DevX
    with:
      config_path: m8flow-backend/devx-ci.yaml
      push: true
      image_tag: ${{ needs.tag.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  designer:
    name: Release m8flow-designer
    needs: tag
    if: inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'designer')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@test/m8flow-nextgen # TEMPORARY: fork DevX
    with:
      config_path: m8flow-designer/devx-ci.yaml
      push: true
      image_tag: ${{ needs.tag.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  keycloak:
    name: Release m8flow-keycloak
    needs: tag
    if: inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'keycloak')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@test/m8flow-nextgen # TEMPORARY: fork DevX
    with:
      config_path: keycloak-extensions/devx-ci.yaml
      push: true
      image_tag: ${{ needs.tag.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  connector-proxy:
    name: Release m8flow-connector-proxy
    needs: tag
    if: inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'connector-proxy')
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@test/m8flow-nextgen # TEMPORARY: fork DevX
    with:
      config_path: m8flow-connector-proxy/devx-ci.yaml
      push: true
      image_tag: ${{ needs.tag.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  summary:
    name: Release Summary
    if: always() && inputs.dry_run != true
    needs: [tag, backend, designer, keycloak, connector-proxy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          COMMIT: ${{ needs.tag.outputs.commit }}
          REGISTRY: 653405621825.dkr.ecr.us-east-2.amazonaws.com
          R_BACKEND: ${{ needs.backend.result }}
          R_DESIGNER: ${{ needs.designer.result }}
          R_KEYCLOAK: ${{ needs.keycloak.result }}
          R_PROXY: ${{ needs.connector-proxy.result }}
        run: |
          {
            echo "## Release \`${TAG}\`"
            echo ""
            echo "Commit: \`${COMMIT}\`"
            echo ""
            echo "| Component | Image | Result |"
            echo "|-----------|-------|--------|"
            echo "| backend | \`${REGISTRY}/m8flow-backend:${TAG}\` | ${R_BACKEND} |"
            echo "| designer | \`${REGISTRY}/m8flow-designer:${TAG}\` | ${R_DESIGNER} |"
            echo "| keycloak | \`${REGISTRY}/m8flow-keycloak:${TAG}\` | ${R_KEYCLOAK} |"
            echo "| connector-proxy | \`${REGISTRY}/m8flow-connector-proxy:${TAG}\` | ${R_PROXY} |"
            echo ""
            echo "Deploy with each component's CI/CD workflow (workflow_dispatch, image_uri above)."
          } >> "$GITHUB_STEP_SUMMARY"

          # A component not selected for this release is 'skipped', which is a
          # normal outcome; only a real failure should fail the release.
          for r in "$R_BACKEND" "$R_DESIGNER" "$R_KEYCLOAK" "$R_PROXY"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::At least one selected component failed to build for ${TAG}."
              exit 1
            fi
          done
