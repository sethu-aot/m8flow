name: m8flow-frontend CI/CD
# =============================================================================
# Triggers:
#   PR to 'main'           → CI only (lint, test, SAST, Trivy, build check)
#   Push/merge to 'main'   → CI only (build + push image to Docker Hub)
#   workflow_dispatch       → CD only (promote pre-built image to dev/demo/qa)
#
# ALL deployments are manual via workflow_dispatch (promotion-only).
# QA and DEMO MUST receive a pre-built image_uri — no fresh builds on dispatch.
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - "m8flow-frontend/**"
      - "docker/m8flow.frontend.Dockerfile"
      - ".github/workflows/frontend-cicd.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "m8flow-frontend/**"
      - "docker/m8flow.frontend.Dockerfile"
      - ".github/workflows/frontend-cicd.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - demo
          - qa
      image_uri:
        description: "Pre-built image URI to promote (e.g. m8flow/m8flow-frontend:dev-a1b2c3d)"
        required: true
        type: string

# Grant the permissions the reusable CI orchestrator needs (security-events,
# actions, packages, pull-requests, id-token). The CD orchestrator handles its
# own AWS OIDC via id-token: write which is also covered here.
permissions:
  contents: read
  security-events: write
  actions: write
  packages: write
  pull-requests: write
  id-token: write
  deployments: write

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Frontend CI Pipeline
    if: github.event_name != 'workflow_dispatch'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@f7042a479506af30c86f73c263e1b0b5eeca9768
    with:
      config_path: m8flow-frontend/devx-ci.yaml
      auto_merge: false
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  cd-dev:
    name: Deploy Frontend → DEV
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@f7042a479506af30c86f73c263e1b0b5eeca9768
    with:
      environment: dev
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-frontend/devx-config.yaml
    secrets: inherit

  cd-demo:
    name: Deploy Frontend → DEMO
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'demo'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@f7042a479506af30c86f73c263e1b0b5eeca9768
    with:
      environment: demo
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-frontend/devx-config.yaml
    secrets: inherit

  cd-qa:
    name: Deploy Frontend → QA
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa'
    uses: sethu-aot/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@f7042a479506af30c86f73c263e1b0b5eeca9768
    with:
      environment: qa
      image_uri: ${{ github.event.inputs.image_uri || '' }}
      config_path: m8flow-frontend/devx-config.yaml
    secrets: inherit
